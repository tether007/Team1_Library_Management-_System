spring.application.name=library

# In-memory database: nothing is written to disk and all data is recreated on every start.
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Paging: default page size and the upper limit a client may request.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
